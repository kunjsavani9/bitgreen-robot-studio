<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BITGREEN Robot Studio — Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--bg1:#ffffff;--bg2:#f4f6f9;--border:#cbd5e1;--accent:#1d4ed8;--green:#15a34a;--red:#dc2626;--dim:#64748b;--text:#1e2733}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--bg1);border:1px solid var(--border);border-radius:16px;padding:38px 36px;width:410px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(30,41,59,.10)}
.logo{display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.logo img{height:50px;display:block}
.sub{font-size:11px;color:var(--dim);text-align:center;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;font-weight:600}
.field input{background:var(--bg1);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,78,216,.12)}
.hint{font-size:10px;color:var(--dim);line-height:1.5}
.btn{background:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:13px;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;color:#fff;cursor:pointer;letter-spacing:.3px;transition:filter .15s;margin-top:6px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:12px;text-align:center;min-height:16px;color:var(--red)}
.msg.ok{color:var(--green)}
.alt{font-size:12px;color:var(--dim);text-align:center}
.alt a{color:var(--accent);text-decoration:none;font-weight:600}
.alt a:hover{text-decoration:underline}
</style>
</head>

    <div style="font-size:11px;color:var(--dim);text-align:center;line-height:1.6">
      We emailed a 6-digit code to<br><span id="otp-email" style="color:var(--accent);font-weight:600"></span>
    </div>
    <div class="field">
      <label for="otp-code">Verification code</label>
      <input type="text" id="otp-code" inputmode="numeric" maxlength="6" autocomplete="off" disabled placeholder="••••••" style="letter-spacing:8px;text-align:center;font-size:18px">
    </div>
    <div class="msg" id="otp-msg"></div>
    <button class="btn" type="submit" id="otp-submit">Verify</button>

  </form>

<script>
const form = document.getElementById('signup-form');
const msg = document.getElementById('msg');
const btn = document.getElementById('submit');
const otpForm = document.getElementById('otp-form');
const otpMsg = document.getElementById('otp-msg');
const otpSubmit = document.getElementById('otp-submit');
let _pendingEmail = '';
let _resendTimer = null;

function showOtp(email){
  _pendingEmail = email;
  document.getElementById('otp-email').textContent = email;
  form.style.display = 'none';
  otpForm.style.display = 'flex';
  // Only NOW make this a one-time-code field, so the email OTP autofill
  // suggestion appears here and not on the signup fields.
  const codeInput = document.getElementById('otp-code');
  codeInput.disabled = false;
  codeInput.setAttribute('autocomplete', 'one-time-code');
  codeInput.focus();
  startResendCooldown(30);
}
function startResendCooldown(sec){
  const link = document.getElementById('resend-link');
  const timer = document.getElementById('resend-timer');
  let left = sec;
  link.style.pointerEvents = 'none'; link.style.opacity = '.4';
  timer.textContent = `(${left}s)`;
  clearInterval(_resendTimer);
  _resendTimer = setInterval(()=>{
    left--;
    if(left <= 0){ clearInterval(_resendTimer); link.style.pointerEvents=''; link.style.opacity=''; timer.textContent=''; }
    else timer.textContent = `(${left}s)`;
  }, 1000);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg'; msg.textContent = '';
  const email = document.getElementById('email').value.trim();
  const username = document.getElementById('username').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  if(!email || !username || !password){ msg.textContent = 'Fill in all fields.'; return; }
  const emailRe = /^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/;
  if(!emailRe.test(email) || email.includes('..')){ msg.textContent = 'Please enter a valid email address.'; return; }
  btn.disabled = true; btn.textContent = 'Sending code…';
  try {
    const r = await fetch('/api/signup', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, username, password})
    });
    const data = await r.json();
    if(!data.ok){ msg.textContent = data.error || 'Signup failed.'; return; }
    if(data.verified){
      // Admin path — account created directly, no OTP.
      msg.className = 'msg ok'; msg.textContent = 'Account created! Redirecting to login…';
      setTimeout(() => { window.location.href = '/login'; }, 1200);
      return;
    }
    // Client path — show OTP entry.
    showOtp(data.email);
  } catch(err) {
    msg.textContent = 'Network error. Is the server running?';
  } finally {
    btn.disabled = false; btn.textContent = 'Create account';
  }
});

otpForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  otpMsg.className = 'msg'; otpMsg.textContent = '';
  const code = document.getElementById('otp-code').value.trim();
  if(code.length !== 6){ otpMsg.textContent = 'Enter the 6-digit code.'; return; }
  otpSubmit.disabled = true; otpSubmit.textContent = 'Verifying…';
  try {
    const r = await fetch('/api/verify_otp', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email:_pendingEmail, code})
    });
    const data = await r.json();
    if(!data.ok){ otpMsg.textContent = data.error || 'Verification failed.'; return; }
    otpMsg.className = 'msg ok'; otpMsg.textContent = 'Verified! Redirecting to login…';
    setTimeout(() => { window.location.href = '/login'; }, 1200);
  } catch(err) {
    otpMsg.textContent = 'Network error. Is the server running?';
  } finally {
    otpSubmit.disabled = false; otpSubmit.textContent = 'Verify';
  }
});

document.getElementById('resend-link').addEventListener('click', async (e) => {
  e.preventDefault();
  otpMsg.className = 'msg'; otpMsg.textContent = '';
  try {
    const r = await fetch('/api/resend_otp', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email:_pendingEmail})
    });
    const data = await r.json();
    if(!data.ok){ otpMsg.textContent = data.error || 'Could not resend.'; return; }
    otpMsg.className = 'msg ok'; otpMsg.textContent = 'A new code has been sent.';
    startResendCooldown(30);
  } catch(err) { otpMsg.textContent = 'Network error.'; }
});

document.getElementById('otp-back').addEventListener('click', (e) => {
  e.preventDefault();
  clearInterval(_resendTimer);
  // Re-disable the code field so its autofill doesn't bleed onto signup fields.
  const codeInput = document.getElementById('otp-code');
  codeInput.value = '';
  codeInput.disabled = true;
  codeInput.setAttribute('autocomplete', 'off');
  otpForm.style.display = 'none';
  form.style.display = 'flex';
});
</script>
</body>
</html>
